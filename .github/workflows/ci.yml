name: ci

on:
  pull_request:
  push:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # O nome do job é o check exigido pela proteção da main.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fixadas por SHA: uma tag pode ser movida para outro código.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O token não fica no .git do runner depois do checkout.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # O client do Prisma é gerado, não versionado: lint, testes e build dependem dele.
      - name: Generate Prisma client
        run: npm run prisma:generate

      # Lint e formatação vêm antes dos testes: falham rápido e barato.
      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      # O runner tem Docker, então os testes com Testcontainers rodam aqui.
      - name: E2E and integration tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
