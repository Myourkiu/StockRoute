# Sobe o sistema inteiro com `docker compose up --wait`. Só o gateway (18000) e
# o Postgres (18432, para inspeção local) são publicados no host.
# As senhas padrão são só de desenvolvimento; um .env sobrescreve (ver .env.example).
# As senhas dos serviços entram literais nas URLs de conexão: use só [A-Za-z0-9_-].
name: stockroute

x-db-passwords: &db-passwords
  CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pw}
  ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_pw}
  INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:-integration_pw}

x-catalog-db-url: &catalog-db-url
  CATALOG_DATABASE_URL: postgresql://catalog_svc:${CATALOG_DB_PASSWORD:-catalog_pw}@postgres:5432/${POSTGRES_DB:-stockroute}?schema=catalog

x-orders-db-url: &orders-db-url
  ORDERS_DATABASE_URL: postgresql://orders_svc:${ORDERS_DB_PASSWORD:-orders_pw}@postgres:5432/${POSTGRES_DB:-stockroute}?schema=orders

x-integration-db-url: &integration-db-url
  INTEGRATION_DATABASE_URL: postgresql://integration_svc:${INTEGRATION_DB_PASSWORD:-integration_pw}@postgres:5432/${POSTGRES_DB:-stockroute}?schema=integration

# One-shot que aplica as migrations de um serviço e termina. É o mesmo papel de
# um Job ou initContainer no Kubernetes (Etapa 5).
x-migrate: &migrate
  depends_on:
    postgres:
      condition: service_healthy
  restart: 'no'

# Healthcheck dos apps pelo /health/ready, na porta HTTP em HEALTH_PORT. Usa o
# próprio Node, então a imagem não precisa de curl nem wget.
x-ready-healthcheck: &ready-healthcheck
  test:
    - CMD
    - node
    - -e
    - "fetch(`http://127.0.0.1:$${process.env.HEALTH_PORT}/health/ready`).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_pw}
      POSTGRES_DB: ${POSTGRES_DB:-stockroute}
      <<: *db-passwords
    ports:
      # Só na interface local: o banco não fica acessível a outras máquinas.
      - '127.0.0.1:18432:5432'
    volumes:
      # A partir do Postgres 18 os dados ficam em /var/lib/postgresql/<versão>.
      - pgdata:/var/lib/postgresql
      # Só roda com o volume vazio: mudar roles ou schemas exige recriar o volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h força TCP: no primeiro start, o servidor temporário que roda os scripts
      # de init só aceita socket, e o healthcheck não pode aprová-lo.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  catalog-migrate:
    <<: *migrate
    build:
      context: .
      target: migrator
      args:
        APP: catalog
    environment:
      <<: *catalog-db-url

  orders-migrate:
    <<: *migrate
    build:
      context: .
      target: migrator
      args:
        APP: orders
    environment:
      <<: *orders-db-url

  integration-migrate:
    <<: *migrate
    build:
      context: .
      target: migrator
      args:
        APP: integration
    environment:
      <<: *integration-db-url

  catalog:
    build:
      context: .
      target: runtime
      args:
        APP: catalog
    environment:
      <<: *catalog-db-url
      CATALOG_TCP_PORT: 18101
      CATALOG_HTTP_PORT: 18201
      HEALTH_PORT: 18201
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    healthcheck: *ready-healthcheck

  orders:
    build:
      context: .
      target: runtime
      args:
        APP: orders
    environment:
      <<: *orders-db-url
      ORDERS_TCP_PORT: 18102
      ORDERS_HTTP_PORT: 18202
      HEALTH_PORT: 18202
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
    healthcheck: *ready-healthcheck

  integration:
    build:
      context: .
      target: runtime
      args:
        APP: integration
    environment:
      <<: *integration-db-url
      INTEGRATION_TCP_PORT: 18103
      INTEGRATION_HTTP_PORT: 18203
      HEALTH_PORT: 18203
    depends_on:
      integration-migrate:
        condition: service_completed_successfully
    healthcheck: *ready-healthcheck

  erp-mock:
    build:
      context: .
      target: runtime
      args:
        APP: erp-mock
    environment:
      ERP_MOCK_HTTP_PORT: 18204
      HEALTH_PORT: 18204
    healthcheck: *ready-healthcheck

  gateway:
    build:
      context: .
      target: runtime
      args:
        APP: gateway
    environment:
      GATEWAY_HTTP_PORT: 18000
      HEALTH_PORT: 18000
      CATALOG_TCP_HOST: catalog
      CATALOG_TCP_PORT: 18101
      ORDERS_TCP_HOST: orders
      ORDERS_TCP_PORT: 18102
      INTEGRATION_TCP_HOST: integration
      INTEGRATION_TCP_PORT: 18103
      ERP_MOCK_URL: http://erp-mock:18204
      # Obrigatório e sem padrão: com um valor conhecido, qualquer um que alcance
      # a porta 18000 assinaria tokens válidos. Vem do .env (ver .env.example).
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (ver .env.example)}
    ports:
      - '18000:18000'
    # Só ordem de subida: o readiness do gateway não depende dos serviços internos.
    depends_on:
      - catalog
      - orders
      - integration
      - erp-mock
    healthcheck: *ready-healthcheck

volumes:
  pgdata:
